<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Desk, 1986 | Jacob Pearson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #F25E0D;
    --cool-white: #F7F7FF;
    --navy: #1A1A2E;
    --slate: #8890A0;
    --border: #32324A;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #0b0810; }
  body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: var(--cool-white); -webkit-font-smoothing: antialiased; }
  #scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; outline: none; }
  #scene.dragging { cursor: grabbing; }
  #scene.link { cursor: pointer; }
  .vignette { position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse at 50% 55%, rgba(0,0,0,0) 45%, rgba(4,2,8,0.72) 100%); }

  .bar {
    position: fixed; top: 0; left: 0; right: 0; height: 56px; z-index: 5;
    display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
  }
  .logo { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; color: var(--cool-white); text-decoration: none; }
  .logo span { color: var(--orange); }
  .views { display: flex; gap: 8px; }
  .views button {
    font: inherit; font-size: 13px; color: var(--cool-white);
    background: rgba(16,12,22,0.7); border: 1px solid var(--border);
    padding: 7px 14px; cursor: pointer; transition: border-color 0.15s, color 0.15s;
  }
  .views button:hover, .views button:focus-visible { border-color: var(--orange); color: var(--orange); outline: none; }

  .foot {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
    padding: 16px 24px; font-size: 12px; color: var(--slate);
  }
  .foot nav { display: flex; gap: 18px; }
  .foot a { color: var(--slate); text-decoration: none; }
  .foot a:hover { color: var(--orange); }

  .card {
    position: fixed; left: 0; right: 0; bottom: 64px; margin: 0 auto; width: fit-content; z-index: 6;
    background: #14101c; border: 1px solid var(--border); border-left: 4px solid var(--orange);
    padding: 16px 44px 16px 20px; min-width: 280px; max-width: calc(100vw - 32px);
    display: none;
  }
  .card.show { display: block; }
  .card small { display: block; font-size: 11px; color: var(--slate); margin-bottom: 6px; }
  .card a { color: var(--orange); font-size: 16px; font-weight: 700; text-decoration: none; }
  .card a:hover { text-decoration: underline; }
  .card button { position: absolute; top: 6px; right: 8px; background: none; border: 0; color: var(--slate); font-size: 16px; cursor: pointer; }

  .panel {
    position: fixed; top: 56px; right: 24px; z-index: 5;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: flex-end;
    font-size: 12px; color: var(--slate);
  }
  .panel label { display: flex; align-items: center; gap: 8px; }
  .panel button {
    font: inherit; font-size: 12px; color: var(--cool-white); background: rgba(16,12,22,0.7);
    border: 1px solid var(--border); padding: 5px 10px; cursor: pointer;
  }
  .panel button[aria-pressed="true"] { border-color: var(--orange); color: var(--orange); }
  .panel input[type=range] { width: 96px; accent-color: var(--orange); }
  .nogl { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 32px; z-index: 9; }
  .nogl a { color: var(--orange); }
    .hint-m { display: none; }
  @media (max-width: 640px) { .hint { display: none; } .hint-m { display: block; } .foot { flex-direction: column; align-items: flex-start; gap: 10px; } .logo { font-size: 12px; } .views button { padding: 7px 10px; font-size: 12px; } .panel { right: 14px; left: 14px; gap: 10px; } .panel input[type=range] { width: 72px; } .bar, .foot { padding-left: 14px; padding-right: 14px; } }
</style>
</head>
<body>

<canvas id="scene" tabindex="0" aria-label="A 3D 1980s desk with a home computer. Use the links at the bottom of the page to navigate."></canvas>
<div class="vignette"></div>

<header class="bar">
  <a class="logo" href="https://www.jacobpearson.com/" target="_top">jacobpearson<span>.</span>com</a>
  <div class="views">
    <button type="button" id="btnScreen">Screen</button>
    <button type="button" id="btnKeys">Keyboard</button>
    <button type="button" id="btnDesk">Desk</button>
  </div>
</header>

<div class="panel" aria-label="Room controls">
  <button type="button" id="btnMusic" aria-pressed="false">Music: off</button>
  <label>Volume <input type="range" id="vol" min="0" max="100" value="60" aria-label="Audio volume"></label>
  <label>Lamp <input type="range" id="lamp" min="0" max="100" value="70" aria-label="Desk lamp brightness"></label>
</div>

<div class="card" id="card" role="status">
  <button type="button" id="cardClose" aria-label="Dismiss">×</button>
  <small id="cardNote">Loaded.</small>
  <a id="cardLink" href="#" target="_blank" rel="noopener">Open</a>
</div>

<footer class="foot">
  <span class="hint-m">Drag to look around, pinch to zoom. Tap Screen, then tap a file or the keys.</span>
  <span class="hint">Drag to look around. Scroll to zoom. Type, or click the keys and the files on screen.</span>
  <nav aria-label="Site">
    <a href="https://www.jacobpearson.com/blog/" target="_top">Blog</a>
    <a href="https://www.jacobpearson.com/about/" target="_top">About</a>
    <a href="https://www.jacobpearson.com/contact/" target="_top">Contact</a>
    <a href="https://www.linkedin.com/in/jacobpearson" target="_blank" rel="noopener">LinkedIn</a>
  </nav>
</footer>

<div class="nogl" id="nogl"><p>This page needs WebGL. Head to the <a href="https://www.jacobpearson.com/blog/" target="_top">blog</a> instead.</p></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/RoundedBoxGeometry.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
<script>
(function () {
  'use strict';

  /* ─── CONFIG ──────────────────────────────────────────────
     LIVE = true on the real site: commands navigate directly.
     LIVE = false in this prototype: commands show a link card. */
  var LIVE = false;
  var SITE = 'https://www.jacobpearson.com';
  var FILES = [
    { n: 'BLOG',     d: 'Articles + case studies', u: SITE + '/blog/' },
    { n: 'ABOUT',    d: 'Who I am',                u: SITE + '/about/' },
    { n: 'CONTACT',  d: 'Get in touch',            u: SITE + '/contact/' },
    { n: 'LINKEDIN', d: 'Career history',          u: 'https://www.linkedin.com/in/jacobpearson' }
  ];

  function noGL() { document.getElementById('nogl').style.display = 'flex'; }
  if (!window.THREE || !window.WebGLRenderingContext) { noGL(); return; }

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ─── RENDERER / SCENE / CAMERA ─────────────────────────── */
  var canvas = document.getElementById('scene');
  var renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true }); }
  catch (e) { noGL(); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x07050b);
  scene.fog = new THREE.Fog(0x07050b, 34, 80);

  // Soft studio reflections so plastics and metal pick up highlights
  var ENV_I = 0.22;
  if (THREE.RoomEnvironment && THREE.PMREMGenerator) {
    try {
      var pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;
    } catch (e) { /* carry on without reflections */ }
  }

  var camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
  var VIEW_DESK = { p: new THREE.Vector3(3.6, 5.0, 12.2), t: new THREE.Vector3(0, 1.5, 0.2), w: 10.5 };
  var VIEW_SCREEN = { p: new THREE.Vector3(0, 2.7, 5.9), t: new THREE.Vector3(0, 2.05, 0), w: 5.0 };
  var VIEW_KEYS = { p: new THREE.Vector3(-0.4, 4.6, 5.6), t: new THREE.Vector3(-0.3, 0.8, 1.2), w: 6.6 };

  var controls = new THREE.OrbitControls(camera, canvas);
  controls.target.copy(VIEW_DESK.t);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.enablePan = false;
  controls.minDistance = 3.0;
  controls.maxDistance = 34;
  controls.minPolarAngle = 0.3;
  controls.maxPolarAngle = Math.PI / 2 - 0.04;
  controls.minAzimuthAngle = -1.15;
  controls.maxAzimuthAngle = 1.15;
  controls.zoomSpeed = 0.8;
  controls.update();

  /* ─── HELPERS ───────────────────────────────────────────── */
  function col(hex) { return new THREE.Color(hex).convertSRGBToLinear(); }
  function mat(hex, opts) {
    var o = { color: col(hex), roughness: 0.7, metalness: 0.0, envMapIntensity: ENV_I };
    if (opts) for (var k in opts) o[k] = opts[k];
    return new THREE.MeshStandardMaterial(o);
  }
  function glowMat(hex) { return new THREE.MeshBasicMaterial({ color: col(hex), toneMapped: false }); }
  function add(m, x, y, z, parent) {
    m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
    (parent || scene).add(m); return m;
  }
  function box(w, h, d, material, x, y, z, parent) {
    return add(new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material), x, y, z, parent);
  }
  function rbox(w, h, d, r, material, x, y, z, parent) {
    var g = THREE.RoundedBoxGeometry ? new THREE.RoundedBoxGeometry(w, h, d, 4, r) : new THREE.BoxGeometry(w, h, d);
    return add(new THREE.Mesh(g, material), x, y, z, parent);
  }
  function cyl(rt, rb, h, material, x, y, z, parent, seg) {
    return add(new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg || 28), material), x, y, z, parent);
  }
  function cable(points, radius, material) {
    var curve = new THREE.CatmullRomCurve3(points.map(function (p) { return new THREE.Vector3(p[0], p[1], p[2]); }));
    curve.curveType = 'centripetal';
    var m = new THREE.Mesh(new THREE.TubeGeometry(curve, 80, radius, 10), material);
    m.castShadow = true; m.receiveShadow = true; scene.add(m); return m;
  }
  // Pillow-shaped bulge for the picture tube
  function tubeGeo(w, h, bulge) {
    var g = new THREE.PlaneGeometry(w, h, 32, 22), p = g.attributes.position;
    for (var i = 0; i < p.count; i++) {
      var x = p.getX(i) / (w / 2), y = p.getY(i) / (h / 2);
      p.setZ(i, bulge * (1 - x * x) * (1 - y * y));
    }
    g.computeVertexNormals(); return g;
  }
  function rrPath(c, x, y, w, h, r) {
    c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }
  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function canvasTex(w, h, draw) {
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    var t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  }

  /* ─── AUDIO: key clacks and an original chiptune loop, all synthesised ─── */
  var AC = null, master = null, sfxBus = null, musicBus = null, noiseBuf = null;
  var gesture = false, volume = 0.6, musicOn = false, musicTimer = null, stepNo = 0, nextT = 0;
  function audio() {
    if (!gesture) return null;
    if (!AC) {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      try { AC = new C(); } catch (e) { return null; }
      master = AC.createGain(); master.gain.value = volume; master.connect(AC.destination);
      sfxBus = AC.createGain(); sfxBus.gain.value = 0.9; sfxBus.connect(master);
      var lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5200; lp.connect(master);
      musicBus = AC.createGain(); musicBus.gain.value = 0.32; musicBus.connect(lp);
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume();
    return AC;
  }
  function noiseHit(t, dur, freq, q, gain, bus, type) {
    var src = AC.createBufferSource(); src.buffer = noiseBuf;
    var f = AC.createBiquadFilter(); f.type = type || 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    var g = AC.createGain(); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    src.connect(f); f.connect(g); g.connect(bus);
    src.start(t, Math.random() * 0.8, dur + 0.02);
  }
  function tone(type, freq, t, dur, gain, bus, slideTo) {
    var o = AC.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    var g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(gain, t + 0.006);
    g.gain.setValueAtTime(gain, t + dur * 0.6); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g); g.connect(bus); o.start(t); o.stop(t + dur + 0.02);
  }
  function clack(up, big) {
    if (!audio()) return;
    var t = AC.currentTime;
    if (up) { noiseHit(t, 0.025, 3400 + Math.random() * 900, 1.4, 0.16, sfxBus); return; }
    noiseHit(t, 0.045, (big ? 1500 : 2300) + Math.random() * 500, 1.1, 0.5, sfxBus);
    tone('sine', big ? 110 : 150, t, 0.06, big ? 0.4 : 0.26, sfxBus, big ? 55 : 80);
  }
  // Sequencer: 8 bars of 16 steps. Chords Am, F, C, G, twice through, with two lead phrases.
  var hz = function (m) { return 440 * Math.pow(2, (m - 69) / 12); };
  var CHORDS = [[45, 57, 60, 64], [41, 53, 57, 60], [48, 55, 60, 64], [43, 55, 59, 62]];
  var LEAD = [
    [76, 0, 72, 74, 76, 0, 81, 0], [79, 0, 77, 76, 77, 0, 72, 0], [76, 0, 74, 72, 67, 0, 72, 74], [74, 0, 71, 0, 67, 69, 71, 0],
    [72, 76, 81, 0, 79, 76, 0, 72], [69, 72, 77, 0, 76, 72, 0, 69], [67, 72, 76, 79, 0, 76, 74, 72], [71, 74, 79, 0, 74, 0, 71, 0]
  ];
  var STEP = 60 / 126 / 4;
  function scheduleStep(n, t) {
    var bar = Math.floor(n / 16) % 8, st = n % 16, ch = CHORDS[bar % 4];
    if (st === 0 || st === 6 || st === 8 || st === 11 || st === 14) tone('triangle', hz(ch[0] - (st === 6 || st === 14 ? 0 : 12)), t, STEP * 1.8, 0.5, musicBus);
    tone('square', hz(ch[1 + (st % 3)] + (st % 6 > 2 ? 12 : 0)), t, STEP * 0.9, 0.07, musicBus);
    if (st % 2 === 0) { var m = LEAD[bar][st / 2]; if (m) tone('square', hz(m), t, STEP * (LEAD[bar][st / 2 + 1] ? 1.7 : 3.2), 0.16, musicBus); }
    if (st % 8 === 0) tone('sine', 150, t, 0.12, 0.6, musicBus, 45);
    if (st % 8 === 4) noiseHit(t, 0.11, 1800, 0.7, 0.3, musicBus);
    if (st % 2 === 0) noiseHit(t, 0.03, 7000, 1, st % 4 === 2 ? 0.1 : 0.05, musicBus, 'highpass');
  }
  function setMusic(on) {
    musicOn = on;
    var b = document.getElementById('btnMusic');
    b.setAttribute('aria-pressed', on ? 'true' : 'false'); b.textContent = on ? 'Music: on' : 'Music: off';
    clearInterval(musicTimer); musicTimer = null;
    if (!on || !audio()) { if (on) { musicOn = false; b.setAttribute('aria-pressed', 'false'); b.textContent = 'Music: off'; } return; }
    stepNo = 0; nextT = AC.currentTime + 0.08;
    musicTimer = setInterval(function () {
      while (nextT < AC.currentTime + 0.2) { scheduleStep(stepNo++, nextT); nextT += STEP; }
    }, 50);
  }

  /* ─── LIGHTS (lamp is added with the lamp model) ────────── */
  scene.add(new THREE.HemisphereLight(col(0x8f86ff), col(0x1a0f24), 0.1));
  var rim = new THREE.DirectionalLight(col(0x6a7dff), 0.22);
  rim.position.set(-8, 7, -2);
  scene.add(rim);

  /* ─── ROOM ──────────────────────────────────────────────── */
  var wallTex = canvasTex(1024, 1024, function (c, w, h) {
    var r = rng(1986);
    c.fillStyle = '#b9bde6'; c.fillRect(0, 0, w, h);
    var cols = ['#ff5fa2', '#ffd23f', '#2ec4b6', '#7b5cd6', '#ff8c42', '#1a1a2e'];
    for (var i = 0; i < 46; i++) {
      var x = r() * w, y = r() * h, s = 18 + r() * 30, cc = cols[Math.floor(r() * cols.length)];
      var kind = Math.floor(r() * 5);
      c.save(); c.translate(x, y); c.rotate(r() * Math.PI * 2);
      c.fillStyle = cc; c.strokeStyle = cc; c.lineWidth = 6; c.lineCap = 'round'; c.lineJoin = 'round';
      if (kind === 0) { c.beginPath(); c.moveTo(0, -s); c.lineTo(s, s * 0.8); c.lineTo(-s, s * 0.8); c.closePath(); c.fill(); }
      else if (kind === 1) { c.beginPath(); for (var k = 0; k < 5; k++) c.lineTo(k * s * 0.5 - s, (k % 2 ? -1 : 1) * s * 0.35); c.stroke(); }
      else if (kind === 2) { c.beginPath(); c.arc(0, 0, s * 0.55, 0, Math.PI * 2); c.stroke(); }
      else if (kind === 3) { for (var a = 0; a < 3; a++) for (var b = 0; b < 3; b++) { c.beginPath(); c.arc(a * 14 - 14, b * 14 - 14, 3.5, 0, Math.PI * 2); c.fill(); } }
      else { c.fillRect(-s * 0.7, -5, s * 1.4, 10); }
      c.restore();
    }
  });
  wallTex.wrapS = wallTex.wrapT = THREE.RepeatWrapping;
  wallTex.repeat.set(4, 2);
  var wall = new THREE.Mesh(new THREE.PlaneGeometry(60, 30), mat(0xffffff, { map: wallTex, roughness: 1, envMapIntensity: 0 }));
  wall.position.set(0, 7, -4.4); wall.receiveShadow = true; scene.add(wall);

  var floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 40), mat(0x3a2a5c, { roughness: 1, envMapIntensity: 0 }));
  floor.rotation.x = -Math.PI / 2; floor.position.set(0, -7.5, 8); scene.add(floor);
  box(60, 0.9, 0.2, mat(0xd9d2ee), 0, -7.05, -4.3);

  // Desk: dark timber with a drawn grain
  var woodTex = canvasTex(1024, 512, function (c, w, h) {
    var r = rng(3);
    c.fillStyle = '#5a3620'; c.fillRect(0, 0, w, h);
    for (var i = 0; i < 260; i++) {
      var y = r() * h, a = 0.04 + r() * 0.1;
      c.strokeStyle = r() > 0.5 ? 'rgba(30,14,6,' + a + ')' : 'rgba(150,96,56,' + a + ')';
      c.lineWidth = 0.6 + r() * 2.4;
      c.beginPath(); c.moveTo(0, y);
      for (var x = 0; x <= w; x += 64) c.lineTo(x, y + Math.sin(x * 0.006 + i) * 5 + (r() - 0.5) * 3);
      c.stroke();
    }
  });
  var wood = mat(0xffffff, { map: woodTex, roughness: 0.48, envMapIntensity: 0.35 });
  var woodDark = mat(0x3a2215, { roughness: 0.6 });
  rbox(17, 0.45, 8.4, 0.06, wood, 0, -0.225, 0);
  box(16.6, 0.5, 0.25, woodDark, 0, -0.7, 3.9);
  box(0.5, 7.1, 7.8, woodDark, -8.0, -4.0, 0);
  box(0.5, 7.1, 7.8, woodDark, 8.0, -4.0, 0);

  // Under the desk, at the back: invented board games and a carton
  (function () {
    var games = [['MOONBASE MIX-UP', '#2b3a8f', '#ffd23f'], ['CASTLE CAPERS', '#b3261e', '#f7f7ff'], ['TURBO TORTOISE', '#1f8a70', '#ffd23f'], ['WORD WOMBAT', '#f2a03d', '#1a1a2e']];
    var y = -7.5, r = rng(21);
    games.forEach(function (gm, i) {
      var w = 3.1 - i * 0.14, h = 0.44, d = 2.1 - i * 0.1;
      var side = canvasTex(512, 72, function (c, W, H) {
        c.fillStyle = gm[1]; c.fillRect(0, 0, W, H);
        c.fillStyle = gm[2]; c.fillRect(0, 0, 26, H); c.fillRect(W - 26, 0, 26, H);
        c.font = 'bold 42px Helvetica, Arial, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillText(gm[0], W / 2, H / 2 + 3);
      });
      var top = canvasTex(512, 344, function (c, W, H) {
        c.fillStyle = gm[1]; c.fillRect(0, 0, W, H);
        c.strokeStyle = gm[2]; c.lineWidth = 10; c.strokeRect(16, 16, W - 32, H - 32);

    ray.setFromCamera(ndc, camera);
  }
  function keyAt() { var hit = ray.intersectObjects(caps, false)[0]; return hit ? hit.object.userData.key : null; }
  function rowAt() {
    var hit = ray.intersectObject(screenMesh, false)[0];
    if (!hit || !hit.uv) return -1;
    var row = Math.floor(((1 - hit.uv.y) * scr.height - BORDER) / CELL);
    return (lines[row] && lines[row].cmd) ? row : -1;
  }
  canvas.addEventListener('pointerdown', function (e) { gesture = true; down = { x: e.clientX, y: e.clientY }; canvas.classList.add('dragging'); canvas.focus({ preventScroll: true }); });
  canvas.addEventListener('pointermove', function (e) {
    if (e.pointerType === 'touch' || !promptOn) return;
    aim(e);
    var k = keyAt(), row = k ? -1 : rowAt();
    if (row !== hoverRow) { hoverRow = row; draw(); }
    canvas.classList.toggle('link', !!k || row >= 0);
  });
  window.addEventListener('pointerup', function (e) {
    canvas.classList.remove('dragging');
    if (!down) return;
    var moved = Math.abs(e.clientX - down.x) + Math.abs(e.clientY - down.y);
    down = null;
    if (moved > 6 || !promptOn || e.target !== canvas) return;
    aim(e);
    var k = keyAt();
    if (k) {
      pressCode(k.code);
      if (!special(k.code) && k.ch) typeChar(k.ch);
      return;
    }
    var row = rowAt();
    if (row >= 0) { var cmd = lines[row].cmd; input = ''; hoverRow = -1; pressCode('Enter'); exec(cmd); }
  });

  /* ─── CAMERA VIEWS ──────────────────────────────────────── */
  var tween = null;
  // On narrow screens, pull the camera back until the view's subject fits the width
  function fitted(v) {
    var d = v.p.clone().sub(v.t), dist = d.length();
    var visibleW = 2 * dist * Math.tan(camera.fov * Math.PI / 360) * camera.aspect;
    return v.t.clone().add(d.multiplyScalar(Math.max(1, v.w / visibleW)));
  }
  function flyTo(v) {
    var p = fitted(v);
    if (reduceMotion) { camera.position.copy(p); controls.target.copy(v.t); controls.update(); return; }
    tween = { t0: performance.now(), dur: 1100, p0: camera.position.clone(), q0: controls.target.clone(), p1: p, q1: v.t };
    controls.enabled = false;
  }
  function viewBtn(id, v) { document.getElementById(id).addEventListener('click', function () { flyTo(v); canvas.focus({ preventScroll: true }); }); }
  viewBtn('btnScreen', VIEW_SCREEN); viewBtn('btnKeys', VIEW_KEYS); viewBtn('btnDesk', VIEW_DESK);
  document.getElementById('cardClose').addEventListener('click', function () { document.getElementById('card').classList.remove('show'); canvas.focus({ preventScroll: true }); });

  /* ─── ROOM CONTROLS ─────────────────────────────────────── */
  document.getElementById('btnMusic').addEventListener('click', function () { gesture = true; setMusic(!musicOn); });
  document.getElementById('vol').addEventListener('input', function () {
    gesture = true; volume = this.value / 100;
    if (audio()) master.gain.setTargetAtTime(volume, AC.currentTime, 0.02);
  });
  document.getElementById('lamp').addEventListener('input', function () { setLamp(this.value / 100); });
  setLamp(0.7);

  /* ─── RESIZE + LOOP ─────────────────────────────────────── */
  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = w < h ? 50 : 40;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();
  camera.position.copy(fitted(VIEW_DESK)); controls.update();

  function frame(now) {
    if (tween) {
      var k = Math.min(1, (now - tween.t0) / tween.dur);
      var e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      camera.position.lerpVectors(tween.p0, tween.p1, e);
      controls.target.lerpVectors(tween.q0, tween.q1, e);
      if (k >= 1) { tween = null; controls.enabled = true; }
    }
    controls.update();
    glow.intensity = 1.0 + Math.sin(now * 0.013) * 0.05;
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  if (window.self === window.top) { try { canvas.focus({ preventScroll: true }); } catch (e) {} }
  boot();
})();
</script>
</body>
</html>
