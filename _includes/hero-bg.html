{% comment %}Screened-back page image behind the nav and header. Put inside a header with class "hero-image-header".{% endcomment %}
{% assign hero_image_found = site.static_files | where: "path", page.image | size %}{% if page.image and hero_image_found > 0 %}<div class="article-hero-bg" style="background-image:url('{{ page.image | relative_url }}')" aria-hidden="true"></div>{% endif %}
